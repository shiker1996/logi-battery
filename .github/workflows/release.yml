name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要打包的版本标签，例如 v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build Windows executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name LogiBattery --icon assets/LogiBattery.ico
          --distpath dist --workpath build/onefile battery_monitor.py

      - name: Name release asset
        shell: pwsh
        run: |
          $assetName = "LogiBattery-$env:RELEASE_TAG-windows-x64.exe"
          Copy-Item dist/LogiBattery.exe "dist/$assetName"
          "RELEASE_ASSET=dist/$assetName" >> $env:GITHUB_ENV

      - name: Create release or upload asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:RELEASE_ASSET --clobber
          } else {
            gh release create $tag $env:RELEASE_ASSET --title "LogiBattery $tag" --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release packaging failed for $tag."
          }
